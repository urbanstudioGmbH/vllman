model: RedHatAI/gemma-4-26B-A4B-it-NVFP4
name: gemma-4-26b-a4b
runtime: vllm-base:260603-nightly-cu130
gpu: "0"
host: "127.0.0.1"
port: 8014

options:
  tensor-parallel-size: 1                         # Just in here to explicitly note that this is TP=1
  trust-remote-code: true                         # Required for parsimg plugins
  max-model-len: 131072                           # 131072 max context
  gpu-memory-utilization: 0.46                    # 46% of 96 GB (RTX Pro 6000 Blackwell)
  reasoning-parser: gemma4                        # Required so reasoning output isn't garbled
  tool-call-parser: gemma4                        # Required so tool calls work
  enable-auto-tool-choice: true                   # Make the model choose tools deliberately
  kv-cache-dtype: fp8                             # Declarative: Triton NVFP4 *must* use fp8 here
  async-scheduling: true                          # Uses vLLMs asynchronous scheduler
  enable-chunked-prefill: true                    # Lowers TTFT in high concurrency, but also slightly lowers throughput 
  max-num-batched-tokens: 8192                    # Use at least 3072 for high interactivity, max 16384 for throughput
  enable-prefix-caching: true                     # Enables vLLM retaining prefixes in KV Cache
  limit-mm-per-prompt:                            # We do this so users can't infinitely stuff context with images
    image: 32                                     # 32 is already generous
    audio: 0                                      # This model cannot process audio
  default-chat-template-kwargs:                    
    enable_thinking: false                        # deactivates reasoning be default
  speculative-config:
    model: google/gemma-4-26B-A4B-it-assistant    # BF16 draft model
    num_speculative_tokens: 4                     # use 5 or 6 if the vast majority of work is structured output
